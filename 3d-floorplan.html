<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>リフォーム後 3Dパース（操作可能）</title>
<style>
  :root { --bg:#1b1f24; --panel:rgba(28,33,40,.92); --txt:#e8edf2; --accent:#5db0ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
              font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  #ui { position:fixed; top:12px; left:12px; z-index:10; background:var(--panel);
        border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:14px 16px; max-width:300px;
        backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  #ui h1 { font-size:15px; margin:0 0 6px; letter-spacing:.3px; }
  #ui p  { font-size:12px; line-height:1.5; margin:0 0 10px; color:#aeb8c2; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; }
  .row label { flex:1; }
  input[type=range]{ width:110px; accent-color:var(--accent); }
  button { background:#2b3340; color:var(--txt); border:1px solid rgba(255,255,255,.14);
           border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  button:hover { background:#36404f; }
  button.on { background:var(--accent); color:#06223d; border-color:var(--accent); }
  #legend { position:fixed; bottom:12px; left:12px; z-index:10; background:var(--panel);
            border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 14px; font-size:11px;
            max-width:320px; color:#cdd6df; }
  #legend b{ color:#fff; }
  #hint { position:fixed; bottom:12px; right:12px; z-index:10; font-size:11px; color:#8b97a3;
          background:var(--panel); padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="app"></div>

<div id="ui">
  <h1>🏠 リフォーム後 3Dパース</h1>
  <p>図面の内寸（幅6950mm 他）をもとに作成した立体モデルです。ドラッグで回転 / ホイールで拡大 / 右ドラッグで移動。</p>
  <div class="row"><label>壁の高さ</label><button id="btnWalls" class="on">表示</button></div>
  <div class="row"><label>壁の透明度</label><input id="opacity" type="range" min="0" max="100" value="100"></div>
  <div class="row"><label>家具</label><button id="btnFurniture" class="on">表示</button></div>
  <div class="row"><label>部屋名ラベル</label><button id="btnLabels" class="on">表示</button></div>
  <div class="row"><label>真上から見る</label><button id="btnTop">切替</button></div>
</div>

<div id="legend">
  <b>このモデルについて</b><br>
  図面（マンション間取り図）から読み取った寸法・帖数で再現しています。中央〜北側の細部は概算です。<br>
  正確な寸法・追加情報をいただければ調整します。
</div>
<div id="hint">操作：左ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=平行移動</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===================================================================
//  寸法設定（単位：メートル）— 図面の内寸を反映。修正はここを編集。
//  座標系： x = 東西（0:西 → 東）, z = 南北（0:南バルコニー側 → 北）, y = 上
// ===================================================================
const ENV = { W: 6.95, D: 11.4, CH: 2.42 };   // 内寸 幅 / 奥行 / 標準天井高
const WALL_T = 0.12;                            // 壁厚
const BAL = 1.4;                                // バルコニー奥行

// --- 部屋（床ゾーン）。x,z は南西角、w=幅(東西)、d=奥行(南北) ---
const ROOMS = [
  { name:'リビング',   x:0.00, z:0.00, w:3.55, d:4.30, color:0xd8c3a5, ch:2.42 },
  { name:'ダイニング', x:3.55, z:0.00, w:1.15, d:2.40, color:0xddc9ad, ch:2.42 },
  { name:'キッチン',   x:4.70, z:0.00, w:2.25, d:2.40, color:0xcfd4d8, ch:2.42 },
  { name:'主寝室',     x:0.00, z:4.42, w:3.40, d:3.60, color:0xc9b79c, ch:2.31 },
  { name:'WIC',        x:0.00, z:8.02, w:1.70, d:1.40, color:0xb7a98f, ch:2.31 },
  { name:'廊下',       x:3.52, z:2.52, w:1.05, d:6.90, color:0xc3c8cd, ch:2.06 },
  { name:'洗面脱衣室', x:4.70, z:4.42, w:1.10, d:1.90, color:0xb9c6cc, ch:2.20 },
  { name:'UB(浴室)',   x:5.55, z:6.32, w:1.40, d:1.80, color:0xa9c4cf, ch:2.10 },
  { name:'トイレ',     x:4.70, z:6.32, w:0.85, d:1.30, color:0xc1cdd2, ch:2.10 },
  { name:'玄関',       x:2.40, z:9.30, w:1.20, d:2.10, color:0x9aa4ad, ch:2.06 },
  { name:'洋室①',     x:0.00, z:9.00, w:2.30, d:2.40, color:0xd0bfa3, ch:2.42 },
  { name:'洋室②',     x:4.30, z:8.40, w:2.65, d:3.00, color:0xd0bfa3, ch:2.42 },
];

// --- 壁セグメント。{x1,z1,x2,z2, h, openings:[{at,width,sill,top}]} ---
//  at = 始点からの開口中心位置(m), sill=下端, top=上端 (床=0基準)
const WALLS = [
  // 外周
  { x1:0, z1:0, x2:ENV.W, z2:0, h:ENV.CH, openings:[{at:1.7,width:2.6,sill:0.0,top:2.2},{at:5.6,width:1.6,sill:0.0,top:2.2}] }, // 南（LDKバルコニー窓）
  { x1:0, z1:ENV.D, x2:ENV.W, z2:ENV.D, h:ENV.CH, openings:[{at:1.1,width:1.7,sill:0.0,top:2.2},{at:5.5,width:1.7,sill:0.0,top:2.2}] }, // 北（洋室バルコニー窓）
  { x1:0, z1:0, x2:0, z2:ENV.D, h:ENV.CH, openings:[] },        // 西
  { x1:ENV.W, z1:0, x2:ENV.W, z2:ENV.D, h:ENV.CH, openings:[{at:10.4,width:1.0,sill:0.0,top:2.06}] }, // 東（玄関ドア付近）

  // LDKと中央ゾーンの間仕切り(z=4.42)
  { x1:0, z1:4.42, x2:3.40, z2:4.42, h:2.42, openings:[{at:2.6,width:0.9,sill:0,top:2.0}] }, // 主寝室入口ドア
  { x1:4.57, z1:4.42, x2:ENV.W, z2:4.42, h:2.42, openings:[] },                              // 洗面側
  // 主寝室 東壁（廊下と仕切る）
  { x1:3.40, z1:4.42, x2:3.40, z2:8.02, h:2.31, openings:[] },
  // WIC 仕切り
  { x1:1.70, z1:8.02, x2:1.70, z2:9.42, h:2.31, openings:[{at:0.7,width:0.8,sill:0,top:2.0}] },
  { x1:0, z1:8.02, x2:1.70, z2:8.02, h:2.31, openings:[] },
  // 廊下 東壁（水回りと仕切る）
  { x1:4.57, z1:4.42, x2:4.57, z2:9.30, h:2.06, openings:[{at:1.0,width:0.7,sill:0,top:2.0},{at:2.6,width:0.7,sill:0,top:2.0}] },
  // 水回り内仕切り
  { x1:4.57, z1:6.32, x2:ENV.W, z2:6.32, h:2.10, openings:[] }, // トイレ/UBと洗面の境
  { x1:5.55, z1:6.32, x2:5.55, z2:8.12, h:2.10, openings:[] },  // UB西壁
  { x1:4.57, z1:8.12, x2:ENV.W, z2:8.12, h:2.10, openings:[] }, // UB北壁
  // 玄関まわり
  { x1:2.40, z1:9.30, x2:2.40, z2:ENV.D, h:2.06, openings:[{at:1.0,width:0.8,sill:0,top:2.0}] }, // 玄関西
  { x1:3.60, z1:9.30, x2:3.60, z2:ENV.D, h:2.06, openings:[] }, // 玄関東
  { x1:2.40, z1:9.30, x2:3.60, z2:9.30, h:2.06, openings:[{at:0.6,width:0.8,sill:0,top:2.0}] }, // 玄関と廊下
  // 洋室①東壁 / 洋室②西壁・南壁
  { x1:2.30, z1:9.00, x2:2.30, z2:ENV.D, h:2.42, openings:[{at:1.6,width:0.8,sill:0,top:2.0}] },
  { x1:0, z1:9.00, x2:2.30, z2:9.00, h:2.42, openings:[] },
  { x1:4.30, z1:8.40, x2:4.30, z2:ENV.D, h:2.42, openings:[{at:0.6,width:0.8,sill:0,top:2.0}] },
  { x1:4.30, z1:8.40, x2:ENV.W, z2:8.40, h:2.42, openings:[] },
];

// --- 家具・設備。box: 中心(x,z), 幅w(東西), 奥d(南北), 高h, 色 ---
const FURNITURE = [
  // リビング
  { name:'ソファ',     x:1.0,  z:3.6,  w:2.1, d:0.9, h:0.75, color:0x6b7b8c },
  { name:'TVボード',   x:0.30, z:1.5,  w:0.45,d:1.4, h:0.45, color:0x3a3f45 },
  { name:'ローテーブル',x:1.0, z:2.4,  w:1.1, d:0.55,h:0.40, color:0x8a6f52 },
  // ダイニング
  { name:'ダイニングT',x:3.95, z:1.4,  w:0.85,d:1.5, h:0.72, color:0x9c7b54 },
  // キッチン
  { name:'キッチン',   x:5.0,  z:0.55, w:2.4, d:0.65,h:0.85, color:0xeceff1 },
  { name:'冷蔵庫',     x:6.5,  z:0.45, w:0.7, d:0.7, h:1.8,  color:0xc9ccd0 },
  { name:'食器棚',     x:6.5,  z:1.7,  w:0.6, d:0.55,h:1.9,  color:0xb7a98f },
  // 主寝室
  { name:'ベッド(D)',  x:1.5,  z:6.6,  w:1.4, d:2.0, h:0.5,  color:0x8694a3 },
  { name:'デスク',     x:0.45, z:4.9,  w:0.6, d:1.0, h:0.72, color:0x9c7b54 },
  // 洋室①
  { name:'ベッド',     x:0.7,  z:10.3, w:1.02,d:2.05,h:0.5,  color:0x8694a3 },
  // 洋室②
  { name:'ベッド',     x:4.9,  z:10.2, w:1.02,d:2.05,h:0.5,  color:0x8694a3 },
  { name:'デスク',     x:6.4,  z:9.0,  w:0.55,d:1.0, h:0.72, color:0x9c7b54 },
  // 水回り
  { name:'浴槽',       x:6.55, z:7.4,  w:0.75,d:1.6, h:0.55, color:0xdfeef2 },
  { name:'洗面化粧台', x:4.95, z:4.7,  w:0.75,d:0.5, h:0.85, color:0xe6ebee },
  { name:'洗濯機',     x:5.55, z:4.7,  w:0.6, d:0.6, h:1.0,  color:0xdfe3e6 },
  { name:'便器',       x:5.0,  z:6.9,  w:0.4, d:0.7, h:0.7,  color:0xf0f3f5 },
  // 玄関
  { name:'シューズBOX',x:3.45, z:11.0, w:0.30,d:1.2, h:1.9,  color:0xb7a98f },
];

// ===================================================================
//  3D 構築
// ===================================================================
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const persp = { pos:new THREE.Vector3(ENV.W*1.1, 9, ENV.D*1.25), tgt:new THREE.Vector3(ENV.W/2, 0, ENV.D/2) };
camera.position.copy(persp.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(persp.tgt);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;

// 照明
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4f57, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-6, 14, -4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const s = 14; Object.assign(sun.shadow.camera, { left:-s, right:s, top:s, bottom:-s, near:1, far:60 });
scene.add(sun);

// 地面 + バルコニー
const groundMat = new THREE.MeshStandardMaterial({ color:0x2a3038 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true;
scene.add(ground);

const balMat = new THREE.MeshStandardMaterial({ color:0x6b7178 });
function addBalcony(x,z,w,d){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), balMat);
  m.position.set(x, 0.05, z); m.receiveShadow = true; scene.add(m);
}
addBalcony(ENV.W/2, -BAL/2, ENV.W, BAL);            // 南バルコニー
addBalcony(ENV.W/2, ENV.D+BAL/2, ENV.W, BAL);       // 北バルコニー

// 床（部屋ごと）
const floorGroup = new THREE.Group(); scene.add(floorGroup);
const labelGroup = new THREE.Group(); scene.add(labelGroup);
ROOMS.forEach(r=>{
  const mat = new THREE.MeshStandardMaterial({ color:r.color, roughness:0.9 });
  const f = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.05, r.d), mat);
  f.position.set(r.x + r.w/2, 0.025, r.z + r.d/2);
  f.receiveShadow = true; floorGroup.add(f);
  labelGroup.add(makeLabel(r.name, r.x + r.w/2, 1.4, r.z + r.d/2));
});

// 壁
const wallGroup = new THREE.Group(); scene.add(wallGroup);
const wallMats = [];
function wallMaterial(){
  const m = new THREE.MeshStandardMaterial({ color:0xf2f0ec, roughness:0.95, transparent:true, opacity:1 });
  wallMats.push(m); return m;
}
function addWallBox(cx,cz,len,h,yC,angle){
  const g = new THREE.BoxGeometry(len, h, WALL_T);
  const m = new THREE.Mesh(g, wallMaterial());
  m.position.set(cx, yC, cz); m.rotation.y = angle;
  m.castShadow = true; m.receiveShadow = true; wallGroup.add(m);
}
WALLS.forEach(w=>{
  const dx = w.x2-w.x1, dz = w.z2-w.z1;
  const len = Math.hypot(dx,dz); if(len<1e-3) return;
  const ang = Math.atan2(dz, dx);   // 壁の向き
  const ux = dx/len, uz = dz/len;
  const h = w.h ?? ENV.CH;
  // 開口を考慮して [start,end] 区間を分割
  let cuts = [{s:0,e:len,full:true}];
  const ops = (w.openings||[]).slice().sort((a,b)=>a.at-b.at);
  // 水平方向の区間（垂れ壁・腰壁は別途）
  let segs = [[0,len]];
  ops.forEach(o=>{
    const a = o.at - o.width/2, b = o.at + o.width/2;
    const next=[];
    segs.forEach(([s,e])=>{
      if(b<=s || a>=e){ next.push([s,e]); return; }
      if(a>s) next.push([s,a]);
      if(b<e) next.push([b,e]);
    });
    segs = next;
  });
  // 開口の無い縦フル壁
  segs.forEach(([s,e])=>{
    const segLen = e-s; if(segLen<1e-3) return;
    const mid = (s+e)/2;
    addWallBox(w.x1+ux*mid, w.z1+uz*mid, segLen, h, h/2, ang);
  });
  // 開口上部の垂れ壁 / 下部の腰壁
  ops.forEach(o=>{
    const mid = o.at;
    const top = o.top ?? h, sill = o.sill ?? 0;
    if(h - top > 0.02) addWallBox(w.x1+ux*mid, w.z1+uz*mid, o.width, h-top, (top+h)/2, ang); // 垂れ壁
    if(sill > 0.02)    addWallBox(w.x1+ux*mid, w.z1+uz*mid, o.width, sill, sill/2, ang);      // 腰壁
    // 窓ガラス（外周窓のみ薄板）
    if((o.top??h) >= 2.0 && (o.sill??0) < 0.05){
      const glass = new THREE.Mesh(
        new THREE.BoxGeometry(o.width, top-sill, 0.02),
        new THREE.MeshStandardMaterial({ color:0x9fd0ee, transparent:true, opacity:0.28, roughness:0.1 }));
      glass.position.set(w.x1+ux*mid, (sill+top)/2, w.z1+uz*mid); glass.rotation.y = ang;
      wallGroup.add(glass);
    }
  });
});

// 家具
const furnGroup = new THREE.Group(); scene.add(furnGroup);
FURNITURE.forEach(f=>{
  const m = new THREE.Mesh(new THREE.BoxGeometry(f.w, f.h, f.d),
    new THREE.MeshStandardMaterial({ color:f.color, roughness:0.7 }));
  m.position.set(f.x, f.h/2 + 0.05, f.z);
  m.castShadow = true; m.receiveShadow = true; furnGroup.add(m);
});

// ラベル（キャンバススプライト）
function makeLabel(text, x, y, z){
  const c = document.createElement('canvas'); const sc=2; c.width=256*sc; c.height=64*sc;
  const ctx = c.getContext('2d'); ctx.scale(sc,sc);
  ctx.fillStyle='rgba(20,24,30,.78)'; roundRect(ctx,4,14,248,36,8); ctx.fill();
  ctx.fillStyle='#eaf2ff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,128,33);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.position.set(x,y,z); sp.scale.set(1.2,0.3,1); return sp;
}
function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ===================================================================
//  UI
// ===================================================================
const $ = id=>document.getElementById(id);
let topView=false;
$('btnWalls').onclick = e=>{ wallGroup.visible=!wallGroup.visible; e.target.classList.toggle('on',wallGroup.visible); e.target.textContent=wallGroup.visible?'表示':'非表示'; };
$('btnFurniture').onclick = e=>{ furnGroup.visible=!furnGroup.visible; e.target.classList.toggle('on',furnGroup.visible); e.target.textContent=furnGroup.visible?'表示':'非表示'; };
$('btnLabels').onclick = e=>{ labelGroup.visible=!labelGroup.visible; e.target.classList.toggle('on',labelGroup.visible); e.target.textContent=labelGroup.visible?'表示':'非表示'; };
$('opacity').oninput = e=>{ const v=e.target.value/100; wallMats.forEach(m=>{ m.opacity=v; m.transparent=v<1; }); };
$('btnTop').onclick = e=>{
  topView=!topView; e.target.classList.toggle('on',topView);
  if(topView){ camera.position.set(ENV.W/2, 16, ENV.D/2+0.01); controls.target.set(ENV.W/2,0,ENV.D/2); }
  else { camera.position.copy(persp.pos); controls.target.copy(persp.tgt); }
};

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
