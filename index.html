<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>リフォーム後 3Dパース（色切替対応）</title>
<style>
  :root { --bg:#1b1f24; --panel:rgba(28,33,40,.93); --txt:#e8edf2; --accent:#5db0ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
              font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; }
  #app { position:fixed; inset:0; }
  .card { background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:12px;
          backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  #ui { position:fixed; top:12px; left:12px; z-index:10; padding:14px 16px; max-width:280px; }
  #ui h1 { font-size:15px; margin:0 0 6px; }
  #ui p  { font-size:12px; line-height:1.5; margin:0 0 10px; color:#aeb8c2; }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; }
  .row label { flex:1; }
  input[type=range]{ width:104px; accent-color:var(--accent); }
  button { background:#2b3340; color:var(--txt); border:1px solid rgba(255,255,255,.14);
           border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  button:hover { background:#36404f; }
  button.on { background:var(--accent); color:#06223d; border-color:var(--accent); }

  #finish { position:fixed; top:12px; right:12px; z-index:10; padding:12px 14px; width:260px;
            max-height:calc(100vh - 24px); overflow:auto; }
  #finish h2 { font-size:14px; margin:2px 0 8px; }
  #finish .grp { margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.08); }
  #finish .grp:last-child { border-bottom:none; }
  #finish .gt { font-size:12px; font-weight:bold; color:var(--accent); margin:0 0 6px; }
  #finish .fl { font-size:11px; color:#aeb8c2; margin:8px 0 2px; }
  #finish .selwrap { display:flex; align-items:center; gap:7px; }
  #finish .sw { width:18px; height:18px; border-radius:4px; border:1px solid rgba(255,255,255,.35); flex:none; }
  #finish select { flex:1; background:#222a34; color:var(--txt); border:1px solid rgba(255,255,255,.16);
                   border-radius:7px; padding:5px 6px; font-size:12px; max-width:100%; }
  #finish .note { font-size:10px; color:#7e8893; margin-top:4px; line-height:1.4; }
  #legend { position:fixed; bottom:12px; left:12px; z-index:10; padding:9px 13px; font-size:11px;
            max-width:300px; color:#cdd6df; } #legend b{ color:#fff; }
  #hint { position:fixed; bottom:12px; right:12px; z-index:10; font-size:11px; color:#8b97a3;
          padding:7px 11px; }
</style>
</head>
<body>
<div id="app"></div>

<div id="ui" class="card">
  <h1>🏠 リフォーム後 3Dパース</h1>
  <p>左ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=移動。右パネルで色を選ぶと3Dが切り替わります。</p>
  <div class="row"><label>壁の透明度</label><input id="opacity" type="range" min="0" max="100" value="100"></div>
  <div class="row"><label>家具</label><button id="btnFurniture" class="on">表示</button></div>
  <div class="row"><label>部屋名ラベル</label><button id="btnLabels" class="on">表示</button></div>
  <div class="row">
    <button id="btnTop">真上から</button>
    <button id="goKitchen">キッチンへ</button>
    <button id="goBath">浴室へ</button>
  </div>
</div>

<div id="finish" class="card">
  <h2>🎨 仕上げ材を選ぶ</h2>
  <div class="grp" id="grpBath"></div>
  <div class="grp" id="grpKitchen"></div>
</div>

<div id="legend" class="card">
  <b>このモデルについて</b><br>
  図面の内寸＋ご指定の機種・色（バニティ1200/プレアスLS/グランスパ1418/トレーシアII列型）を反映。
  中央〜北側の間取り細部と、色見本のRGBは近似値です。
</div>
<div id="hint" class="card">操作：左ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=平行移動</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

  { x1:4.57, z1:6.32, x2:ENV.W, z2:6.32, h:2.10, openings:[] },
  { x1:5.55, z1:6.32, x2:5.55, z2:8.12, h:2.10, openings:[] },
  { x1:4.57, z1:8.12, x2:ENV.W, z2:8.12, h:2.10, openings:[] },
  { x1:2.40, z1:9.30, x2:2.40, z2:ENV.D, h:2.06, openings:[{at:1.0,width:0.8,sill:0,top:2.0}] },
  { x1:3.60, z1:9.30, x2:3.60, z2:ENV.D, h:2.06, openings:[] },
  { x1:2.40, z1:9.30, x2:3.60, z2:9.30, h:2.06, openings:[{at:0.6,width:0.8,sill:0,top:2.0}] },

  { x1:4.30, z1:8.40, x2:ENV.W, z2:8.40, h:2.42, openings:[] },

// 一般家具（キッチン・水回りの詳細は別途生成）
const FURNITURE = [
  { x:1.0,  z:3.6,  w:2.1, d:0.9, h:0.75, color:0x6b7b8c }, // ソファ
  { x:0.30, z:1.5,  w:0.45,d:1.4, h:0.45, color:0x3a3f45 }, // TVボード

  { x:6.5,  z:0.45, w:0.7, d:0.7, h:1.8,  color:0xc9ccd0 }, // 冷蔵庫

  { x:1.5,  z:6.6,  w:1.4, d:2.0, h:0.5,  color:0x8694a3 }, // 主寝室ベッド
  { x:0.45, z:4.9,  w:0.6, d:1.0, h:0.72, color:0x9c7b54 }, // デスク
  { x:0.7,  z:10.3, w:1.02,d:2.05,h:0.5,  color:0x8694a3 }, // 洋室①ベッド
  { x:4.9,  z:10.2, w:1.02,d:2.05,h:0.5,  color:0x8694a3 }, // 洋室②ベッド
  { x:6.4,  z:9.0,  w:0.55,d:1.0, h:0.72, color:0x9c7b54 }, // 洋室②デスク
  { x:5.55, z:5.5,  w:0.6, d:0.6, h:1.0,  color:0xdfe3e6 }, // 洗濯機
  { x:3.45, z:11.0, w:0.30,d:1.2, h:1.9,  color:0xb7a98f }, // シューズBOX
];

// ===================================================================
//  カラーパレット（色名 → RGB近似値）
// ===================================================================
const PAL = {
  bathAccent: [
    ['フロウストーングレー',0xb6b1aa],['ウォルナットホワイト',0xddd2c2],['ウォルナットダーク',0x6e5440],
    ['ストーングレー',0x9a9893],['ベージュ',0xcfc2ab],['ホワイト',0xf1efe9],['ネイビー',0x33415a],['グリーン',0x5f6f5c],
  ],
  bathFloor: [
    ['チェッポビアンコ',0xddd9cf],['ピエトラグレージュ',0xb3a994],['サンディグレー',0xa8a49b],
    ['カームホワイト',0xdddad2],['カームベージュ',0xc8bca6],['カームグレー',0xb0ada6],['カームダークグレー',0x6f6e6b],
    ['ホワイトグレー(FRP)',0xdcdcd8],['グレーベージュ(FRP)',0xc8bdac],['グレー(FRP)',0xb6b6b2],
  ],
  bathTub: [
    ['クリスタルパールホワイト',0xf0efe9],['シュガーライトグレー',0xd9d8d2],['シュガーライトベージュ',0xddd3c0],
    ['シュガーブラック',0x2c2b2c],['ホワイト(FRP)',0xf2f1ec],['ベージュ(FRP)',0xe4dccb],['ライトグレー(FRP)',0xd6d6d2],
  ],
  kitDoor: [
    ['スタッコグレー',0xb8b2a8],['ホワイトアッシュ',0xe3ded3],['グレージュアッシュ',0xcbbfa8],['ウォルナットホワイト',0xd8cdbd],
    ['ウォルナットグレージュ',0xb9a890],['チェスナットミディアム',0x6b4a32],['フロウストーングレー',0xb6b1aa],
    ['フロウストーンテラコッタ',0xc9a98f],['マットベージュ',0xb6ab98],['マットホワイトグレー',0xd7d4cc],
    ['マットグレー',0x8a8a88],['マットブラック',0x2b2b2b],['マットアッシュグリーン',0x6f7563],
    ['ホワイト',0xf1efe9],['フローラルアイボリー',0xe9e0cf],['ライトグレー',0xcfd0cf],['ベージュ',0xcdbda6],['ブルーグリーン',0x1f4a4a],
  ],
  kitPanel: [
    ['エルムホワイト',0xe6ded0],['エルムナチュラル',0xcbb392],['ブラウンアッシュ',0x7d5a44],['アウリジーナタイル',0xe3d6c4],
    ['チェッポストーンライト',0xcfc8ba],['チェッポストーンダーク',0x6e6a64],['スウェディッシュベージュ',0xd8cab2],
    ['スウェディッシュグレー',0xc2bcb2],['ルナダークグレー',0x5f5d5a],['トラバーチンホワイト',0xe0d8c8],
    ['ドラマチックホワイト',0xece7df],['コンクリートライト',0xcfccc6],['コンクリートダーク',0x6f6e6c],
    ['スノーモザイク',0xe8e8e6],['ミルキーモザイク',0xece6da],['ビアンコテラゾー',0xded9cf],
    ['ジオライングリーン',0x7e8a72],['ジオラインピンク',0xd9c2bf],
    ['ウッドマイル',0xc9ad86],['ストーンホワイト',0xe2dccf],['パールホワイト',0xecebe6],['ホワイト',0xf2f1ec],
    ['マーブルグレー',0xcfcdc8],['マーブル',0xe6e3dc],
  ],
  kitTop: [
    ['ホワイトクレイ',0xe8e4da],['ブランソルベ',0xece8df],['グリスサボン',0xc9c6bd],['グレイコンチェルト',0x9b9893],
    ['サンディヘイズ',0xb9b0a0],['ミスティブラック',0x3a3a3c],
    ['モデレートアイスグレー',0xd2d2cf],['モデレートアッシュ',0xb4b2ac],['モデレートココア',0x7c6a59],
    ['モデレートブラック',0x33312f],['ソリッドホワイト',0xefeee9],['ソリッドベージュ',0xddd2bf],['ソリッドライトグレー',0xd3d2cd],
  ],
};
const findHex = (list,name)=> (list.find(o=>o[0]===name)||list[0])[1];

// ===================================================================
//  3D 基盤
// ===================================================================
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const persp = { pos:new THREE.Vector3(ENV.W*1.1, 9, ENV.D*1.25), tgt:new THREE.Vector3(ENV.W/2, 0, ENV.D/2) };
camera.position.copy(persp.pos);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(persp.tgt);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2 - 0.02;

scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4f57, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-6, 14, -4); sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
const s = 14; Object.assign(sun.shadow.camera, { left:-s, right:s, top:s, bottom:-s, near:1, far:60 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60,60), new THREE.MeshStandardMaterial({ color:0x2a3038 }));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);

const balMat = new THREE.MeshStandardMaterial({ color:0x6b7178 });
function addBalcony(x,z,w,d){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d), balMat);
  m.position.set(x,0.05,z); m.receiveShadow=true; scene.add(m); }
addBalcony(ENV.W/2, -BAL/2, ENV.W, BAL);
addBalcony(ENV.W/2, ENV.D+BAL/2, ENV.W, BAL);

// 床＋ラベル
const floorGroup = new THREE.Group(); scene.add(floorGroup);
const labelGroup = new THREE.Group(); scene.add(labelGroup);
ROOMS.forEach(r=>{
  const f = new THREE.Mesh(new THREE.BoxGeometry(r.w,0.05,r.d), new THREE.MeshStandardMaterial({ color:r.color, roughness:0.9 }));
  f.position.set(r.x+r.w/2, 0.025, r.z+r.d/2); f.receiveShadow=true; floorGroup.add(f);
  labelGroup.add(makeLabel(r.name, r.x+r.w/2, 1.4, r.z+r.d/2));
});

// 壁
const wallGroup = new THREE.Group(); scene.add(wallGroup);
const wallMats = [];
function wallMaterial(){ const m=new THREE.MeshStandardMaterial({ color:0xf2f0ec, roughness:0.95, transparent:true, opacity:1 }); wallMats.push(m); return m; }
function addWallBox(cx,cz,len,h,yC,angle){
  const m=new THREE.Mesh(new THREE.BoxGeometry(len,h,WALL_T), wallMaterial());
  m.position.set(cx,yC,cz); m.rotation.y=angle; m.castShadow=true; m.receiveShadow=true; wallGroup.add(m);
}
WALLS.forEach(w=>{
  const dx=w.x2-w.x1, dz=w.z2-w.z1, len=Math.hypot(dx,dz); if(len<1e-3) return;
  const ang=Math.atan2(dz,dx), ux=dx/len, uz=dz/len, h=w.h??ENV.CH;
  const ops=(w.openings||[]).slice().sort((a,b)=>a.at-b.at);
  let segs=[[0,len]];
  ops.forEach(o=>{ const a=o.at-o.width/2, b=o.at+o.width/2, next=[];
    segs.forEach(([sg,eg])=>{ if(b<=sg||a>=eg){next.push([sg,eg]);return;} if(a>sg)next.push([sg,a]); if(b<eg)next.push([b,eg]); });
    segs=next; });
  segs.forEach(([sg,eg])=>{ const L=eg-sg; if(L<1e-3)return; const mid=(sg+eg)/2; addWallBox(w.x1+ux*mid,w.z1+uz*mid,L,h,h/2,ang); });
  ops.forEach(o=>{ const mid=o.at, top=o.top??h, sill=o.sill??0;
    if(h-top>0.02) addWallBox(w.x1+ux*mid,w.z1+uz*mid,o.width,h-top,(top+h)/2,ang);
    if(sill>0.02)  addWallBox(w.x1+ux*mid,w.z1+uz*mid,o.width,sill,sill/2,ang);
    if((o.top??h)>=2.0 && (o.sill??0)<0.05){
      const g=new THREE.Mesh(new THREE.BoxGeometry(o.width,top-sill,0.02), new THREE.MeshStandardMaterial({ color:0x9fd0ee, transparent:true, opacity:0.28, roughness:0.1 }));
      g.position.set(w.x1+ux*mid,(sill+top)/2,w.z1+uz*mid); g.rotation.y=ang; wallGroup.add(g);
    }
  });
});

// 一般家具
const furnGroup = new THREE.Group(); scene.add(furnGroup);
FURNITURE.forEach(f=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(f.w,f.h,f.d), new THREE.MeshStandardMaterial({ color:f.color, roughness:0.7 }));
  m.position.set(f.x, f.h/2+0.05, f.z); m.castShadow=true; m.receiveShadow=true; furnGroup.add(m); });

function box(cx,cz,w,d,h,baseY,mat,group){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(cx, baseY+h/2, cz); m.castShadow=true; m.receiveShadow=true; (group||scene).add(m); return m; }

// ===================================================================
//  色切替対応マテリアル（指定の初期色）
// ===================================================================
const M = {
  bathAccent: new THREE.MeshStandardMaterial({ color:findHex(PAL.bathAccent,'フロウストーングレー'), roughness:0.85 }),
  bathFloor : new THREE.MeshStandardMaterial({ color:findHex(PAL.bathFloor,'サンディグレー'), roughness:0.9 }),
  bathTub   : new THREE.MeshStandardMaterial({ color:findHex(PAL.bathTub,'クリスタルパールホワイト'), roughness:0.25 }),

// ラベル
function makeLabel(text,x,y,z){
  const c=document.createElement('canvas'), sc=2; c.width=256*sc; c.height=64*sc;
  const ctx=c.getContext('2d'); ctx.scale(sc,sc);
  ctx.fillStyle='rgba(20,24,30,.78)'; rr(ctx,4,14,248,36,8); ctx.fill();
  ctx.fillStyle='#eaf2ff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,128,33);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthTest:false }));
  sp.position.set(x,y,z); sp.scale.set(1.2,0.3,1); return sp;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ===================================================================
//  仕上げ材UI（色を選ぶと即反映）
// ===================================================================
function buildSelect(parentEl, labelText, options, defaultName, material, noteText){
  const fl=document.createElement('div'); fl.className='fl'; fl.textContent=labelText; parentEl.appendChild(fl);
  const wrap=document.createElement('div'); wrap.className='selwrap';
  const sw=document.createElement('span'); sw.className='sw';
  const sel=document.createElement('select');
  options.forEach(([n,hex])=>{ const op=document.createElement('option'); op.value=n; op.textContent=n;
    if(n===defaultName) op.selected=true; sel.appendChild(op); });
  const apply=name=>{ const hex=findHex(options,name); material.color.setHex(hex); sw.style.background='#'+hex.toString(16).padStart(6,'0'); };
  sel.onchange=()=>apply(sel.value); apply(defaultName);
  wrap.appendChild(sw); wrap.appendChild(sel); parentEl.appendChild(wrap);
  if(noteText){ const nt=document.createElement('div'); nt.className='note'; nt.textContent=noteText; parentEl.appendChild(nt); }
}

const $=id=>document.getElementById(id);
let topView=false;
function moveTo(px,py,pz, tx,ty,tz){ camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); topView=false; $('btnTop').classList.remove('on'); }

$('opacity').oninput=e=>{ const v=e.target.value/100; wallMats.forEach(m=>{ m.opacity=v; m.transparent=v<1; }); };
$('btnTop').onclick=e=>{ topView=!topView; e.target.classList.toggle('on',topView);
  if(topView){ camera.position.set(ENV.W/2,16,ENV.D/2+0.01); controls.target.set(ENV.W/2,0,ENV.D/2); }
  else { camera.position.copy(persp.pos); controls.target.copy(persp.tgt); } };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
