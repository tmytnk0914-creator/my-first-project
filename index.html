<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>田中様邸 リフォーム後 3Dプレビュー（プラン2-2）</title>
<style>
  :root{ --bg:#1b1f24; --panel:rgba(28,33,40,.93); --txt:#e8edf2; --accent:#5db0ff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
             font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; }
  #app{ position:fixed; inset:0; }
  .card{ background:var(--panel); border:1px solid rgba(255,255,255,.1); border-radius:12px;
         backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .panel{ position:fixed; z-index:10; overflow:hidden; }
  .phead{ display:flex; align-items:center; gap:8px; padding:9px 12px; cursor:move;
          touch-action:none; user-select:none; -webkit-user-select:none; }
  .phead .ptitle{ flex:1; font-size:14px; font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pmin{ background:#2b3340; border:1px solid rgba(255,255,255,.18); color:var(--txt);
         width:30px; height:30px; border-radius:7px; font-size:18px; line-height:1; padding:0; cursor:pointer; flex:none; }
  .pbody{ padding:0 14px 12px; }
  .panel.collapsed .pbody{ display:none; }
  .panel.collapsed{ width:auto !important; }
  #ui{ top:12px; left:12px; width:250px; }
  #ui .pbody p{ font-size:12px; line-height:1.5; margin:0 0 10px; color:#aeb8c2; }
  .row{ display:flex; align-items:center; gap:8px; margin:7px 0; font-size:13px; }
  .row label{ flex:1; }
  input[type=range]{ width:104px; accent-color:var(--accent); }
  button{ background:#2b3340; color:var(--txt); border:1px solid rgba(255,255,255,.14);
          border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; }
  button:hover{ background:#36404f; } button.on{ background:var(--accent); color:#06223d; border-color:var(--accent); }
  #legend{ bottom:12px; left:12px; width:250px; }
  #legend .pbody{ font-size:11px; line-height:1.5; color:#cdd6df; } #legend b{ color:#fff; }
  #val{ white-space:pre-line; font-size:10.5px; color:#bcd; margin-top:6px; }
  @media (max-width:760px){ #ui,#legend{ width:200px; } .phead .ptitle{ font-size:13px; } }
  #ver{ position:fixed; bottom:10px; right:12px; z-index:11; font-size:12px; font-weight:bold; color:#cfe0ee;
        background:rgba(28,33,40,.9); padding:5px 11px; border-radius:8px; border:1px solid rgba(93,176,255,.5); }
</style>
</head>
<body>
<div id="app"></div>
<div id="ver">Ver 2.0 · 2026-06-15</div>

<div id="ui" class="card panel">
  <div class="phead"><span class="ptitle">🏠 操作</span><button class="pmin">–</button></div>
  <div class="pbody">
    <p>プラン2-2（内寸 12.81×6.95m）。1本指=回転 / ピンチ=ズーム / 2本指=移動。</p>
    <div class="row"><label>壁の透明度</label><input id="opacity" type="range" min="0" max="100" value="100"></div>
    <div class="row"><label>屋根(天井)</label><button id="btnCeil">なし</button></div>
    <div class="row"><label>家具</label><button id="btnFurn" class="on">表示</button></div>
    <div class="row"><label>部屋名</label><button id="btnLab" class="on">表示</button></div>
    <div class="row"><button id="btnTop">真上から</button><button id="btnIso">鳥瞰</button></div>
  </div>
</div>

<div id="legend" class="card panel">
  <div class="phead"><span class="ptitle">ℹ️ 情報 / 面積検算</span><button class="pmin">–</button></div>
  <div class="pbody">
    JSON(寸法線・bbox・CH・床レベル・家具)を一次情報に生成。中央コア（廊下・玄関まわり）の細部は調整中です。
    <div id="val"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const K = 0.001;                 // mm → m
const T = 70;                    // 壁厚 mm
const WALL_H_DEFAULT = 2400;

// ===== 部屋（JSON floorplan_plan2-2 より） bbox=[x1,y1,x2,y2] mm =====
// 座標: x=東(右)+, y=南(下)+, 原点=北西角
const ROOMS = [
  {id:'dk',     n:'DK',       tatami:5.1, ch:2058, fl:0,   bbox:[0,0,3915,2180],      c:0xddc9ad},
  {id:'living', n:'リビング', tatami:12.2,ch:2423, fl:0,   bbox:[0,2180,3910,6950],   c:0xd8c3a5},
  {id:'master', n:'主寝室',   tatami:7.0, ch:2314, fl:0,   bbox:[3980,2750,7140,6950],c:0xc9b79c},
  {id:'wic1',   n:'WIC①',    tatami:0,   ch:2314, fl:0,   bbox:[6310,2750,7140,4730],c:0xb7a98f},
  {id:'wic2',   n:'WIC②',    tatami:0,   ch:2328, fl:0,   bbox:[7575,0,8770,2245],   c:0xb7a98f},
  {id:'west1',  n:'洋室1',    tatami:5.1, ch:2418, fl:0,   bbox:[8885,0,12810,2610],  c:0xd0bfa3},
  {id:'west2',  n:'洋室2',    tatami:4.3, ch:2418, fl:0,   bbox:[9700,2680,12810,5685],c:0xd0bfa3},
  {id:'wash',   n:'洗面脱衣室',tatami:0,  ch:2030, fl:48,  bbox:[4755,0,6175,2030],   c:0xbcd0d6},
  {id:'ub',     n:'UB 浴室',  tatami:0,   ch:2100, fl:70,  bbox:[6175,0,7575,1800],   c:0xa9c4cf},
  {id:'toilet', n:'トイレ',   tatami:0,   ch:2025, fl:28,  bbox:[6320,1850,7320,2630],c:0xc1cdd2},
  {id:'hall',   n:'廊下',     tatami:0,   ch:2063, fl:0,   bbox:[4685,2290,8885,3380],c:0xc7ccd0, clip:true},
  {id:'entr',   n:'玄関',     tatami:0,   ch:2063, fl:-57, bbox:[7400,3380,8885,5400],c:0x9aa4ad, clip:true},
  {id:'pantry', n:'パントリー',tatami:0,  ch:2300, fl:0,   bbox:[3915,0,4685,1890],   c:0xe0d6c2},
];

// ===== 開口（壁の切れ目）orient:'h'(x可変,z=at) / 'v'(z可変,x=at), a..b 区間 mm =====
const W_TOP = 2200, D_TOP = 2000;   // 窓/ドアの上端
const OPENINGS = [
  // 掃き出し窓（西・東バルコニー）
  {orient:'v', at:0,     a:250,  b:1900, sill:0, top:W_TOP, type:'win'},   // DK 西
  {orient:'v', at:0,     a:3400, b:6300, sill:0, top:W_TOP, type:'win'},   // リビング 西（上部1150は壁・南西は柱）
  {orient:'v', at:12810, a:300,  b:2300, sill:0, top:W_TOP, type:'win'},   // 洋室1 東
  {orient:'v', at:12810, a:2900, b:5500, sill:0, top:W_TOP, type:'win'},   // 洋室2 東
  // リビング↔DK 一体（壁なし）
  {orient:'h', at:2180,  a:0,    b:3910, sill:0, top:2600, type:'open'},
  // 室内窓（リビング↔主寝室・LIXILデコマド 3列2段）作り付け収納の上
  {orient:'v', at:3945,  a:4150, b:6150, sill:850, top:2050, type:'deco'},
  // 室内ドア（概略位置）
  {orient:'v', at:3915,  a:500,  b:1300, sill:0, top:2000},   // パントリー入口（キッチン側）
  {orient:'v', at:3910,  a:2300, b:2780, sill:0, top:2000},   // リビング入口（廊下側からのドア）
  {orient:'v', at:6175,  a:500,  b:1300, sill:0, top:D_TOP},  // 洗面↔UB
  {orient:'h', at:2030,  a:5000, b:5800, sill:0, top:D_TOP},  // 廊下↔洗面
  {orient:'h', at:2630,  a:6450, b:7050, sill:0, top:D_TOP},  // 廊下↔トイレ
  {orient:'h', at:2245,  a:7900, b:8500, sill:0, top:D_TOP},  // 廊下↔WIC②
  {orient:'h', at:2750,  a:5700, b:6500, sill:0, top:D_TOP},  // 廊下↔主寝室
  {orient:'v', at:7140,  a:3600, b:4400, sill:0, top:D_TOP},  // 廊下↔WIC①（廊下側アクセス）
  {orient:'h', at:2750,  a:4400, b:5150, sill:0, top:2000},   // 主寝室↔廊下
  {orient:'h', at:6950,  a:7700, b:8400, sill:0, top:2000},   // 玄関 入口（南・共用廊下側）
  {orient:'v', at:4685,  a:2400, b:3300, sill:0, top:2000},   // 廊下↔リビング入口側 接続
  {orient:'v', at:8885,  a:1800, b:2580, sill:0, top:D_TOP},  // 廊下↔洋室1
  {orient:'v', at:9700,  a:3000, b:3800, sill:0, top:D_TOP},  // 玄関↔洋室2
  {orient:'v', at:3945,  a:2900, b:3700, sill:0, top:2003},   // リビング↔主寝室 建具(CH2003)
];

// ===== 家具（plan rect mm, h=高さmm） =====
const FURN = [
  // DK（北=コンロ / 南=シンク対面。間の通路を広く）
  ['dk','コンロ(壁付)',2050,60,3700,710,850,0xeceef0],     // 北壁 W1650 D650
  ['dk','シンク(対面)',2050,1520,3700,2170,850,0xeceef0],  // 対面 W1650 D650（通路約810mm）
  ['dk','冷蔵庫',1350,60,2050,760,1800,0xc9ccd0],          // W700(冷W650×D650)
  ['dk','カウンター収納',40,60,1390,660,850,0xb7a98f],     // W750+W600=1350
  ['dk','ダイニングT',300,1250,1800,2020,720,0x9c7b54],    // 1500×770
  // パントリー（キッチン側walk-in）＋収納（南=リビング側 両開き扉）
  ['pantry','可動棚',3955,40,4665,440,1850,0xc9a978],      // 上 可動棚×4(450)
  ['pantry','可動棚',3955,1600,4665,1875,1850,0xc9a978],   // 下 可動棚×4(300)
  ['pantry','収納',3950,1905,4665,2275,1950,0xb89a72],     // 収納本体(可動棚400)
  ['pantry','扉',3958,2272,4300,2296,1900,0x8a7256],       // 両開き扉(左)
  ['pantry','扉',4312,2272,4660,2296,1900,0x8a7256],       // 両開き扉(右)
  // リビング
  ['living','ソファ',650,3450,2750,4350,750,0x6b7b8c],     // 2100×900
  ['living','TVボード',1500,6500,2900,6950,450,0x3a3f45],  // 1400×450(南壁)
  ['living','本棚',520,6650,1420,6950,900,0xb7a98f],        // 900×300(南壁西寄り)
  ['living','作付収納',3456,4150,3910,6150,850,0xc8b79a],  // 2000×454 h850(東壁・デコ窓下)
  ['living','造作ｶｳﾝﾀｰ',3980,6300,5320,6900,850,0x9c7b54],
  // 主寝室
  ['master','ベッド(D)',4450,3850,6530,5050,400,0x8694a3],
  ['master','デスク',4050,2820,4950,3420,720,0x9c7b54],
  // WIC（ハンガーパイプ＋可動棚）
  ['wic1','ﾊﾟｲﾌﾟ',6480,2950,6580,4550,50,0x9a9a9a,1750],
  ['wic1','棚',6900,2820,7090,4600,1750,0xa99a82],
  ['wic2','棚',7650,120,8740,420,1750,0xa99a82],
  ['wic2','ﾊﾟｲﾌﾟ',7680,520,8720,620,50,0x9a9a9a,1750],
  ['wic2','ﾊﾟｲﾌﾟ',7660,650,7760,2120,50,0x9a9a9a,1750],
  // 洋室1
  ['west1','電子ピアノ',9700,100,11070,550,900,0x33363a],
  ['west1','デスク',11250,100,12250,700,720,0x9c7b54],
  ['west1','ベッド(S)',10000,1500,12050,2520,400,0x8694a3],
  ['west1','ｵｰﾌﾟﾝCL',8920,100,9450,2100,1800,0xa99a82],   // L=1400
  ['west1','ﾊﾟｲﾌﾟ',9080,300,9180,1850,50,0x9a9a9a,1750],
  // 洋室2
  ['west2','デスク',10000,2780,11000,3380,720,0x9c7b54],
  ['west2','ベッド(S)',9900,4600,11950,5620,400,0x8694a3],
  ['west2','ｵｰﾌﾟﾝCL',9750,2730,10950,3150,1800,0xa99a82],   // L=1200
  ['west2','ﾊﾟｲﾌﾟ',9850,2830,11000,2930,50,0x9a9a9a,1750],
  // 水回り
  ['wash','洗面化粧台',4800,400,5300,1600,850,0xe6ebee],
  ['wash','洗濯機',5450,100,6050,700,1000,0xdfe3e6],
  ['ub','浴槽',6950,250,7520,1650,550,0xeaf3f4],
  ['toilet','便器',6480,2050,6880,2520,400,0xf0f3f5],
  // 玄関
  ['entr','玄関収納',8485,3500,8885,4700,1900,0xb7a98f],
];

// ===================== Three.js =====================
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; app.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x10141a);

const CX=12810/2*K, CZ=6950/2*K;
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
const ISO={pos:new THREE.Vector3(CX+8.5,11,CZ+9.5),tgt:new THREE.Vector3(CX,0,CZ)};
camera.position.copy(ISO.pos);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.copy(ISO.tgt); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2-0.02;

scene.add(new THREE.HemisphereLight(0xffffff,0x4a4f57,0.95));
const sun=new THREE.DirectionalLight(0xffffff,1.35); sun.position.set(-8,16,-6); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const s=16; Object.assign(sun.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:1,far:70}); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x2a3038}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.4; ground.receiveShadow=true; scene.add(ground);

// バルコニー（西・東）
const balMat=new THREE.MeshStandardMaterial({color:0x6b7178});
function bal(x,z,w,d){ const mItem=new THREE.Mesh(new THREE.BoxGeometry(w,0.1,d),balMat); mItem.position.set(x,0.05,z); mItem.receiveShadow=true; scene.add(mItem); }
bal(-0.7, CZ, 1.3, 6.95*0.92);                 // 西
bal(12.81+0.7, CZ, 1.3, 6.95*0.92);            // 東

// 床（部屋ごと、床レベル反映）
const floorGroup=new THREE.Group(); scene.add(floorGroup);
const labelGroup=new THREE.Group(); scene.add(labelGroup);
ROOMS.forEach(r=>{
  const [x1,y1,x2,y2]=r.bbox, ex=40;
  const w=(x2-x1+2*ex)*K, d=(y2-y1+2*ex)*K;
  const fl=r.fl*K;
  const f=new THREE.Mesh(new THREE.BoxGeometry(w,0.05,d),new THREE.MeshStandardMaterial({color:r.c,roughness:0.92}));
  f.position.set((x1+x2)/2*K, fl-0.025, (y1+y2)/2*K); f.receiveShadow=true; floorGroup.add(f);
  const lab=r.tatami>0?`${r.n}\n${r.tatami}帖 / CH${r.ch}`:`${r.n}\nCH${r.ch}`;
  labelGroup.add(makeLabel(lab,(x1+x2)/2*K,1.5,(y1+y2)/2*K));
});

// 壁
const wallGroup=new THREE.Group(); scene.add(wallGroup);
const ceilGroup=new THREE.Group(); ceilGroup.visible=false; scene.add(ceilGroup);
const wallMats=[];
function wallMat(){ const mt=new THREE.MeshStandardMaterial({color:0xf2f0ec,roughness:0.95,transparent:true,opacity:1}); wallMats.push(mt); return mt; }
function box(group,cx,cz,sx,sz,y0,y1,mt){ const g=new THREE.Mesh(new THREE.BoxGeometry(sx*K,(y1-y0)*K,sz*K),mt);
  g.position.set(cx*K,(y0+y1)/2*K,cz*K); g.castShadow=true; g.receiveShadow=true; group.add(g); return g; }
function drawWall(orient,fixed,a,b,y0,y1){
  if(orient==='h') box(wallGroup,(a+b)/2,fixed,(b-a),T,y0,y1,wallMat());
  else             box(wallGroup,fixed,(a+b)/2,T,(b-a),y0,y1,wallMat());
}
function glass(orient,fixed,a,b,sill,top){
  const mt=new THREE.MeshStandardMaterial({color:0x9fd0ee,transparent:true,opacity:0.26,roughness:0.1});
  if(orient==='h') box(wallGroup,(a+b)/2,fixed,(b-a),20,sill,top,mt);
  else             box(wallGroup,fixed,(a+b)/2,20,(b-a),sill,top,mt);
}
// LIXILデコマド（3列2段）：ガラス＋方立/中桟（弧なし）
function decoWindow(orient,fixed,a,b,sill,top){
  glass(orient,fixed,a,b,sill,top);
  const fr=new THREE.MeshStandardMaterial({color:0x8a7a66,roughness:0.7});
  const my=(sill+top)/2;
  if(orient==='v'){
    box(wallGroup,fixed,(a+b)/2,90,(b-a),my-25,my+25,fr);          // 中桟(横)
    [a+(b-a)/3,a+2*(b-a)/3].forEach(z=>box(wallGroup,fixed,z,90,50,sill,top,fr)); // 方立(縦)×2
    box(wallGroup,fixed,(a+b)/2,90,(b-a),sill,sill+30,fr);
    box(wallGroup,fixed,(a+b)/2,90,(b-a),top-30,top,fr);
  }else{
    box(wallGroup,(a+b)/2,fixed,(b-a),90,my-25,my+25,fr);
    [a+(b-a)/3,a+2*(b-a)/3].forEach(x=>box(wallGroup,x,fixed,50,90,sill,top,fr));
  }
}
// clip:true の部屋（廊下・玄関）は、他室の内部にめり込む壁だけ自動カットする
const SOLID_ROOMS=ROOMS.filter(r=>!r.clip);
function subInterval(segs,a,b){ const nx=[]; segs.forEach(([cs,ce])=>{ if(b<=cs||a>=ce){nx.push([cs,ce]);return;} if(a>cs)nx.push([cs,a]); if(b<ce)nx.push([b,ce]); }); return nx; }
function midInSolid(orient,fixed,a,b){ const mx=orient==='h'?(a+b)/2:fixed, my=orient==='h'?fixed:(a+b)/2;
  return SOLID_ROOMS.some(r=>{const[x1,y1,x2,y2]=r.bbox; return mx>x1+60&&mx<x2-60&&my>y1+60&&my<y2-60;}); }
const seen=new Set();
function edge(orient,fixed,s,e,ch,clip){
  const key=`${orient}|${Math.round(fixed/40)}|${Math.round((s+e)/200)}|${Math.round((e-s)/120)}|${clip?'c':''}`;
  if(seen.has(key)) return; seen.add(key);
  const ops=OPENINGS.filter(o=>o.orient===orient && Math.abs(o.at-fixed)<40 && o.b>s+1 && o.a<e-1);
  let segs=[[s,e]];
  ops.forEach(o=>{ segs=subInterval(segs,Math.max(s,o.a),Math.min(e,o.b)); });
  if(clip) SOLID_ROOMS.forEach(r=>{ const[bx1,by1,bx2,by2]=r.bbox;
    if(orient==='h'){ if(fixed>by1+60&&fixed<by2-60) segs=subInterval(segs,bx1+60,bx2-60); }
    else { if(fixed>bx1+60&&fixed<bx2-60) segs=subInterval(segs,by1+60,by2-60); } });
  segs.forEach(([cs,ce])=>{ if(ce-cs>1) drawWall(orient,fixed,cs,ce,0,ch); });
  ops.forEach(o=>{ const a=Math.max(s,o.a), b=Math.min(e,o.b); if(b<=a) return;
    if(clip&&midInSolid(orient,fixed,a,b)) return;
    const top=o.top??D_TOP, sill=o.sill??0;
    if(ch-top>20) drawWall(orient,fixed,a,b,top,ch);
    if(sill>20)   drawWall(orient,fixed,a,b,0,sill);
    if(o.type==='win') glass(orient,fixed,a,b,sill,top);
    else if(o.type==='deco') decoWindow(orient,fixed,a,b,sill,top);
  });
}
// 躯体柱（リビング南西角）
const COLUMNS=[[0,6450,450,6950]];
ROOMS.forEach(r=>{ const [x1,y1,x2,y2]=r.bbox, ch=r.ch||WALL_H_DEFAULT;
  edge('h',y1,x1,x2,ch,r.clip); edge('h',y2,x1,x2,ch,r.clip); edge('v',x1,y1,y2,ch,r.clip); edge('v',x2,y1,y2,ch,r.clip);
  const cm=new THREE.Mesh(new THREE.BoxGeometry((x2-x1)*K,0.04,(y2-y1)*K),new THREE.MeshStandardMaterial({color:0xf6f5f1}));
  cm.position.set((x1+x2)/2*K, ch*K, (y1+y2)/2*K); ceilGroup.add(cm);
});
COLUMNS.forEach(([x1,y1,x2,y2])=>box(wallGroup,(x1+x2)/2,(y1+y2)/2,(x2-x1),(y2-y1),0,2423,wallMat()));
// ① 外周（footprint）寸法線から確定。南東に段差(ノッチ)：東壁はy5685まで
const PERIMETER=[['h',0,0,12810],['v',12810,0,5685],['h',5685,9700,12810],['v',9700,5685,6950],['h',6950,0,9700],['v',0,0,6950]];
PERIMETER.forEach(([o,f,a,b])=>edge(o,f,a,b,2450,false));

// 家具
const furnGroup=new THREE.Group(); scene.add(furnGroup);
const roomFL=Object.fromEntries(ROOMS.map(r=>[r.id,r.fl]));
FURN.forEach(a=>{
  const [rid,lab,x1,y1,x2,y2,h,col,base=0]=a;
  const fl=(roomFL[rid]||0)+base;
  const mt=new THREE.MeshStandardMaterial({color:col,roughness:0.7});
  box(furnGroup,(x1+x2)/2,(y1+y2)/2,(x2-x1),(y2-y1),fl,fl+h,mt);
});

// ラベル
function makeLabel(text,x,y,z){
  const lines=text.split('\n'), c=document.createElement('canvas'), sc=2; c.width=256*sc; c.height=80*sc;
  const ctx=c.getContext('2d'); ctx.scale(sc,sc);
  ctx.fillStyle='rgba(20,24,30,.8)'; rr(ctx,4,8,248,64,8); ctx.fill();
  ctx.fillStyle='#eaf2ff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 24px sans-serif'; ctx.fillText(lines[0],128,30);
  ctx.font='15px sans-serif'; ctx.fillStyle='#aab8c6'; if(lines[1]) ctx.fillText(lines[1],128,56);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.position.set(x,y,z); sp.scale.set(1.35,0.42,1); return sp;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 面積検算（畳数×1.62㎡ ±10%）
(function validate(){
  let out=[];
  ROOMS.filter(r=>r.tatami>0).forEach(r=>{
    const [x1,y1,x2,y2]=r.bbox; let area=(x2-x1)*(y2-y1)*1e-6;
    if(r.id==='master') area-=(0.83*1.98); // WIC①食い込み分
    const tgt=r.tatami*1.62, ok=Math.abs(area/tgt-1)<=0.10;
    out.push(`${ok?'✅':'⚠️'} ${r.n}: ${area.toFixed(1)}㎡ (目標${tgt.toFixed(1)})`);
  });
  document.getElementById('val').textContent=out.join('\n');
})();

// ===== UI =====
const $=id=>document.getElementById(id);
$('opacity').oninput=e=>{ const v=e.target.value/100; wallMats.forEach(m=>{ m.opacity=v; m.transparent=v<1; }); };
$('btnCeil').onclick=e=>{ ceilGroup.visible=!ceilGroup.visible; e.target.classList.toggle('on',ceilGroup.visible); e.target.textContent=ceilGroup.visible?'あり':'なし'; };
$('btnFurn').onclick=e=>{ furnGroup.visible=!furnGroup.visible; e.target.classList.toggle('on',furnGroup.visible); e.target.textContent=furnGroup.visible?'表示':'非表示'; };
$('btnLab').onclick=e=>{ labelGroup.visible=!labelGroup.visible; e.target.classList.toggle('on',labelGroup.visible); e.target.textContent=labelGroup.visible?'表示':'非表示'; };
$('btnTop').onclick=()=>{ camera.position.set(CX,15,CZ+0.01); controls.target.set(CX,0,CZ); };
$('btnIso').onclick=()=>{ camera.position.copy(ISO.pos); controls.target.copy(ISO.tgt); };

// パネル最小化＆ドラッグ
function setupPanel(el){
  const head=el.querySelector('.phead'), min=el.querySelector('.pmin');
  min.addEventListener('pointerdown',e=>e.stopPropagation());
  min.addEventListener('click',e=>{ e.stopPropagation(); const c=el.classList.toggle('collapsed'); min.textContent=c?'＋':'–'; });
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  head.addEventListener('pointerdown',e=>{ if(e.target.closest('.pmin'))return; const r=el.getBoundingClientRect();
    el.style.left=r.left+'px'; el.style.top=r.top+'px'; el.style.right='auto'; el.style.bottom='auto';
    ox=r.left; oy=r.top; sx=e.clientX; sy=e.clientY; drag=true; head.setPointerCapture(e.pointerId); e.preventDefault(); });
  head.addEventListener('pointermove',e=>{ if(!drag)return;
    el.style.left=Math.max(2,Math.min(innerWidth-46,ox+e.clientX-sx))+'px';
    el.style.top=Math.max(2,Math.min(innerHeight-36,oy+e.clientY-sy))+'px'; });
  const end=e=>{ drag=false; try{head.releasePointerCapture(e.pointerId);}catch(_){} };
  head.addEventListener('pointerup',end); head.addEventListener('pointercancel',end);
}
['ui','legend'].forEach(id=>setupPanel($(id)));
if(innerWidth<760) ['ui','legend'].forEach(id=>{ const el=$(id); el.classList.add('collapsed'); el.querySelector('.pmin').textContent='＋'; });

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
