<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>間取り 2D 平面図（プラン2-2）</title>
<style>
  :root{ --bg:#11151b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:#e8edf2;
             font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; }
  header{ padding:13px 16px 4px; } header h1{ font-size:16px; margin:0 0 3px; }
  header p{ font-size:12px; line-height:1.5; color:#aeb8c2; margin:3px 0; }
  .badge{ display:inline-block; background:#0d4a5a; color:#aee6f3; font-size:11px; font-weight:bold;
          padding:2px 8px; border-radius:20px; margin-bottom:5px; }
  #wrap{ width:100%; overflow:auto; padding:6px 8px 30px; }
  svg{ width:100%; height:auto; max-width:1000px; display:block; margin:0 auto; background:#fbfaf7; border-radius:10px; }
  .rn{ font-weight:bold; fill:#1c222b; text-anchor:middle; }
  .rs{ fill:#5b636d; text-anchor:middle; }
  .cap{ fill:#7b818a; text-anchor:middle; font-size:11px; }
  .narr{ fill:#445; text-anchor:middle; font-weight:bold; }
</style>
</head>
<body>
<header>
  <span class="badge">平面図（3Dと同一データ）</span>
  <h1>🗺️ 田中様邸 プラン2-2 間取り 2D</h1>
  <p>内寸 東西12,810 × 南北6,950mm。西・東にバルコニー、玄関は南。3Dと同じ寸法データから生成しています。</p>
</header>
<div id="wrap"><svg id="plan" role="img"></svg></div>

<script>
const S=0.05, m=v=>v*S, NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('plan');
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
const add=e=>(svg.appendChild(e),e);
const txt=(x,y,s,c,fs)=>{const t=el('text',{x:m(x),y:m(y),class:c,'font-size':fs});t.textContent=s;return add(t);};

const W=12810, D=6950;
svg.setAttribute('viewBox',`${-90} ${-70} ${m(W)+180} ${m(D)+150}`);

// 部屋 (id,name,tatami,ch,bbox[x1,y1,x2,y2],clip)
const ROOMS=[
  ['dk','DK',5.1,2058,[0,0,3915,2180]],
  ['living','リビング',12.2,2423,[0,2180,3910,6950]],
  ['master','主寝室',7.0,2314,[3980,2750,7140,6950]],
  ['wic1','WIC①',0,2314,[6310,2750,7140,4730]],
  ['wic2','WIC②',0,2328,[7575,0,8770,2245]],
  ['west1','洋室1',5.1,2418,[8885,0,12810,2610]],
  ['west2','洋室2',4.3,2418,[9700,2680,12810,5685]],
  ['wash','洗面脱衣室',0,2030,[4755,0,6175,2030]],
  ['ub','UB浴室',0,2100,[6175,0,7575,1800]],
  ['toilet','トイレ',0,2025,[6320,1850,7320,2630]],
  ['pantry','パントリー',0,2300,[3915,0,4685,1890]],
  ['hall','廊下',0,2063,[4685,2290,8885,3380],1],
  ['entr','玄関',0,2063,[7400,3380,8885,5400],1],
];
const COLOR={dk:'#ddc9ad',living:'#d8c3a5',master:'#c9b79c',wic1:'#b7a98f',wic2:'#b7a98f',
  west1:'#d0bfa3',west2:'#d0bfa3',wash:'#bcd0d6',ub:'#a9c4cf',toilet:'#c1cdd2',pantry:'#e0d6c2',hall:'#cfd4d8',entr:'#aab2ba'};

// 開口 orient:'h'(x可変,z=at)/'v'(z可変,x=at), a..b, type
const OPEN=[
  ['v',0,250,1900,'win'],['v',0,3400,6300,'win'],          // 西窓 DK/リビング
  ['v',12810,300,2300,'win'],['v',12810,2900,5500,'win'],  // 東窓 洋室1/2
  ['h',2180,0,3910,'open'],                                 // リビング↔DK 一体
  ['v',3945,4150,6150,'deco'],['v',3945,2900,3700,'door'],  // デコ窓 / 主寝室建具
  ['v',3915,500,1300,'door'],['v',3910,2300,2780,'door'],   // パントリー入口 / リビング入口
  ['v',6175,500,1300,'door'],['h',2030,5000,5800,'door'],   // 洗面↔UB / 廊下↔洗面
  ['h',2630,6450,7050,'door'],['h',2245,7900,8500,'door'],  // トイレ / WIC②
  ['v',7140,3600,4400,'door'],['h',2750,4400,5150,'door'],  // 廊下↔WIC① / 主寝室↔廊下
  ['v',8885,1800,2580,'door'],['v',9700,3000,3800,'door'],  // 洋室1 / 洋室2
  ['h',6950,7700,8400,'door'],['v',4685,2400,3300,'door'],  // 玄関入口 / 廊下接続
];

// バルコニー（西・東）
add(el('rect',{x:m(-1200),y:m(300),width:m(1100),height:m(D-600),fill:'#eef1f2',stroke:'#9aa4ad','stroke-width':1.2,'stroke-dasharray':'5 4'}));
txt(-650,D/2,'バルコニー(西)','cap',11);
add(el('rect',{x:m(W+100),y:m(300),width:m(1100),height:m(2400),fill:'#eef1f2',stroke:'#9aa4ad','stroke-width':1.2,'stroke-dasharray':'5 4'}));
add(el('rect',{x:m(W+100),y:m(2900),width:m(1100),height:m(2700),fill:'#eef1f2',stroke:'#9aa4ad','stroke-width':1.2,'stroke-dasharray':'5 4'}));
txt(W+650,D/2,'バルコニー(東)','cap',11);

// 床（clip部屋を下に、solidを上に重ねて重なりを隠す）
const ordered=[...ROOMS].sort((a,b)=>(b[5]?1:0)-(a[5]?1:0));
ordered.forEach(([id,n,t,ch,bb,clip])=>{
  const[x1,y1,x2,y2]=bb;
  add(el('rect',{x:m(x1),y:m(y1),width:m(x2-x1),height:m(y2-y1),fill:COLOR[id]||'#ddd'}));
});

// 室内壁（solid部屋の外形を線で）
ROOMS.forEach(([id,n,t,ch,bb,clip])=>{ if(clip)return; const[x1,y1,x2,y2]=bb;
  add(el('rect',{x:m(x1),y:m(y1),width:m(x2-x1),height:m(y2-y1),fill:'none',stroke:'#5b626b','stroke-width':2}));
});

// 外周（footprint・南東ノッチ）
const P=[[0,0],[W,0],[W,5685],[9700,5685],[9700,6950],[0,6950]];
add(el('polygon',{points:P.map(([x,y])=>`${m(x)},${m(y)}`).join(' '),fill:'none',stroke:'#1d2127','stroke-width':5}));

// 開口（壁を白で切る＋窓は水色／ドアは直線リーフ。弧は描かない）
OPEN.forEach(([o,at,a,b,type])=>{
  if(o==='v'){ add(el('rect',{x:m(at)-3,y:m(a),width:6,height:m(b-a),fill:'#fbfaf7'})); }
  else        { add(el('rect',{x:m(a),y:m(at)-3,width:m(b-a),height:6,fill:'#fbfaf7'})); }
  if(type==='win'||type==='deco'){
    const col=type==='deco'?'#9c8b6f':'#7fb6d6';
    if(o==='v') add(el('line',{x1:m(at),y1:m(a),x2:m(at),y2:m(b),stroke:col,'stroke-width':3}));
    else        add(el('line',{x1:m(a),y1:m(at),x2:m(b),y2:m(at),stroke:col,'stroke-width':3}));
  }else if(type==='door'){
    const len=Math.min(b-a,800);
    if(o==='v') add(el('line',{x1:m(at),y1:m(a),x2:m(at+len),y2:m(a),stroke:'#9aa1a8','stroke-width':1.6}));
    else        add(el('line',{x1:m(a),y1:m(at),x2:m(a),y2:m(at+len),stroke:'#9aa1a8','stroke-width':1.6}));
  }
});

// ラベル
ROOMS.forEach(([id,n,t,ch,bb,clip])=>{ const[x1,y1,x2,y2]=bb, cx=(x1+x2)/2, cy=(y1+y2)/2;
  const small=(x2-x1)<1500||(y2-y1)<1100;
  txt(cx,cy-(small?20:40),n,'rn',small?12:15);
  if(!small){ txt(cx,cy+90,t>0?`${t}帖 / CH${ch}`:`CH${ch}`,'rs',10.5); }
});

// 方位＋玄関入口マーク
txt(W+650,200,'N↑','narr',14);
txt(8050,D+430,'▲ 玄関入口','cap',11);
</script>
</body>
</html>
